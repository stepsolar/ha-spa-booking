name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --select F,E9,B,ASYNC custom_components tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install homeassistant pytest
      - run: python -m pytest tests -q

  frontend:
    name: Card and website form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The card is a module: a syntax error would break every dashboard.
      - run: node --check --input-type=module < custom_components/spa_booking/frontend/spa-booking-card.js
      # The WordPress form, run end to end against a simulated page.
      - run: node tests/frontend/form_test.js custom_components/spa_booking/frontend/spa-booking-form.txt
      # The Richiesta form of the card: one box per person, payload, editing.
      - run: node tests/frontend/card_request_test.js custom_components/spa_booking/frontend/spa-booking-card.js

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The topics are set in the GitHub repository settings, not in code.
          ignore: brands topics
