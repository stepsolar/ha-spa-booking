name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --select F,E9,B,ASYNC custom_components tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install homeassistant pytest
      - run: python -m pytest tests -q

  frontend:
    name: Card and website form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The card is a module: a syntax error would break every dashboard.
      - run: node --check --input-type=module < custom_components/spa_booking/frontend/spa-booking-card.js
      # The stepped form the website loads from Home Assistant (2.2.0b3).
      - run: node --check custom_components/spa_booking/frontend/spa-booking-form.js
      # The WordPress form, run end to end against a simulated page.
      - run: node tests/frontend/form_test.js custom_components/spa_booking/frontend/spa-booking-form.txt
      # The Richiesta form of the card: one box per person, payload, editing.
      - run: node tests/frontend/card_request_test.js custom_components/spa_booking/frontend/spa-booking-card.js
      # The Spa tab tiles: sections, colours, brightness, thermostat, sensors.
      - run: node tests/frontend/card_spa_test.js custom_components/spa_booking/frontend/spa-booking-card.js
      # The WhatsApp connection box: engine choice, QR code, link code.
      - run: node tests/frontend/card_whatsapp_test.js custom_components/spa_booking/frontend/spa-booking-card.js
      # 2.2: international prefix, roles, PIN screen, vouchers.
      - run: node tests/frontend/card_login_test.js custom_components/spa_booking/frontend/spa-booking-card.js

  bridge:
    name: WhatsApp bridge (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      # The shipped program must build from these sources.
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/spa-wa-bridge .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The topics are set in the GitHub repository settings, not in code.
          ignore: brands topics
